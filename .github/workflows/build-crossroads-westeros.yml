name: Build Crossroads Westeros ROM

on:
  push:
    branches:
      - chatgpt/crossroads-westeros
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Record Actions run ID
        run: |
          mkdir -p crossroads_westeros
          printf '%s\n' "$GITHUB_RUN_ID" > crossroads_westeros/latest_run_id.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crossroads_westeros/latest_run_id.txt
          git commit -m "Record Crossroads build run $GITHUB_RUN_ID" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Install GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ python3 python3-pil libpng-dev \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Clone Pokemon Crossroads source
        run: |
          git clone --depth 1 https://github.com/eonlynx/pokecrossroads.git crossroads
          git -C crossroads rev-parse HEAD

      - name: Apply Westeros foundation edits
        run: python3 crossroads_westeros/apply_westeros.py crossroads

      - name: Apply Westeros presentation v2
        run: python3 crossroads_westeros/apply_westeros_v2.py crossroads

      - name: Convert title artwork to GBA 4bpp
        run: python3 crossroads_westeros/fix_title_palette.py crossroads

      - name: Fix GBA cartridge header
        run: python3 crossroads_westeros/fix_gba_header.py crossroads

      - name: Build ROM
        working-directory: crossroads
        env:
          GAME_VERSION: EMERALD
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          make -j$(nproc) -O all
          test -f westeros_crossroads.gba
          ls -lh westeros_crossroads.gba

      - name: Record build information
        run: |
          sha256sum crossroads/westeros_crossroads.gba | tee crossroads/WESTEROS_BUILD_SHA256.txt
          cat > crossroads/WESTEROS_BUILD_NOTES.txt <<'EOF'
          Game of Thrones / Westeros RPG - Crossroads v2
          Base: eonlynx/pokecrossroads master
          Engine: pokeemerald-expansion / Pokemon Crossroads

          This build intentionally treats Crossroads as an engine rather than a Pokemon presentation.

          Added/changed in v2:
          - Game of Thrones title logo source artwork in native GBA 4bpp format
          - Removed Rayquaza from title scene
          - GBA header/title identifies the game as a Thrones RPG
          - Start-menu terminology: Lore, Party, Pack, Realm Map, Hunt Map
          - Pokemon-facing terms broadly converted to Westeros RPG terminology in player-facing text
          - Pokemon Center -> Healer's Hall
          - Pokemon League -> Iron Throne
          - Hall of Fame -> Book of Deeds
          - money -> gold; badges -> sigils; trainer -> fighter; gyms -> keeps
          - Major Hoenn map-section display names repurposed as Westeros locations
          - Route labels repurposed as Westeros roads/regions
          - First starter/early creature display names begin conversion to direwolves, dragon progression, squire/knight and hounds
          - Winterfell opening and first quest hook from v1 retained

          The master spec in the build branch defines the continuing conversion: Houses/distinct starts, weapons/armor/renown, companions, dragons, human/undead factions, political branching, living-world NPC simulation, Iron Throne progression and ruler postgame.
          EOF

      - name: Upload compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: westeros-crossroads-v2-rom
          path: |
            crossroads/westeros_crossroads.gba
            crossroads/WESTEROS_BUILD_SHA256.txt
            crossroads/WESTEROS_BUILD_NOTES.txt
          if-no-files-found: error
          retention-days: 7
