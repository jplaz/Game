name: Build Crossroads Westeros ROM

on:
  push:
    branches:
      - chatgpt/crossroads-westeros
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Install GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ python3 python3-pil libpng-dev \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Clone Pokemon Crossroads source
        run: |
          git clone --depth 1 https://github.com/eonlynx/pokecrossroads.git crossroads
          git -C crossroads rev-parse HEAD

      - name: Apply Westeros foundation edits
        run: python3 crossroads_westeros/apply_westeros.py crossroads

      - name: Apply compile-safe Westeros presentation pass
        run: python3 crossroads_westeros/apply_westeros_v2_safe.py crossroads

      - name: Replace Pokemon visuals, cast, creatures and world presentation
        run: python3 crossroads_westeros/full_westeros_conversion.py crossroads

      - name: Convert title artwork to GBA 4bpp
        run: python3 crossroads_westeros/fix_title_palette.py crossroads

      - name: Fix GBA cartridge header
        run: python3 crossroads_westeros/fix_gba_header.py crossroads

      - name: Build ROM
        id: build
        continue-on-error: true
        working-directory: crossroads
        env:
          GAME_VERSION: EMERALD
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        shell: bash
        run: |
          set -o pipefail
          make -j$(nproc) -O all 2>&1 | tee ../crossroads_westeros/LAST_BUILD_LOG.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            test -f westeros_crossroads.gba
            ls -lh westeros_crossroads.gba
          fi
          exit "$status"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: westeros-build-diagnostics
          path: crossroads_westeros/LAST_BUILD_LOG.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Verify and record build information
        if: steps.build.outcome == 'success'
        run: |
          test "$(stat -c%s crossroads/westeros_crossroads.gba)" -ge 16777216
          sha256sum crossroads/westeros_crossroads.gba | tee crossroads/WESTEROS_BUILD_SHA256.txt
          cat > crossroads/WESTEROS_BUILD_NOTES.txt <<'EOF'
          A Song of Ice and Monsters: Thronebound - Full Westeros Conversion Build
          Base engine: eonlynx/pokecrossroads / pokeemerald-expansion

          This build intentionally keeps the proven GBA engine internally while replacing its visible identity.

          Included:
          - Game of Thrones / Westeros title and cartridge identity
          - Westeros region and city naming across the world map
          - Major cast conversion: Eddard, Robb, Sansa, Jon, Jaime, Brienne, Melisandre, Beric, Ygritte, Arya, Bran, Oberyn, Tywin, Euron and others
          - Faction conversion including Lannister and Greyjoy forces
          - Broad story/dialogue conversion to Westeros terminology
          - All creature species display names converted away from Pokemon identity
          - Procedural GBA battle art replacing Pokemon battlers with direwolves, dragons, lions, ravens, stags, krakens, wights, warhorses, bears and hounds
          - Starter lines specifically converted to direwolf, dragon and lion progressions
          - Legendary slots converted to creatures such as Balerion, Drogon and sea drakes
          - Trainer portraits repainted as armored Westerosi fighters/nobles
          - Overworld people sprite sheets medievalized into cloaked/armored figures
          - World tileset palettes shifted darker and earthier for a medieval Westeros presentation
          - Lorebook, Party, Pack, Realm Map, Healer's Hall, Iron Throne, Book of Deeds, Gold and Sigils UI terminology
          - Full 32 MiB Crossroads GBA ROM output retained

          Engine-safety protections:
          - Player-facing conversion does not rewrite GBA control codes inside {...}
          - String matching cannot cross source lines
          EOF

      - name: Upload compiled ROM
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: thronebound-full-westeros-gba
          path: |
            crossroads/westeros_crossroads.gba
            crossroads/WESTEROS_BUILD_SHA256.txt
            crossroads/WESTEROS_BUILD_NOTES.txt
          if-no-files-found: error
          retention-days: 30

      - name: Fail workflow if ROM build failed
        if: steps.build.outcome != 'success'
        run: exit 1
