name: Build Crossroads Westeros ROM

on:
  push:
    branches:
      - chatgpt/crossroads-westeros
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v4

      - name: Install GBA toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git make gcc g++ python3 libpng-dev \
            binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi

      - name: Clone Pokemon Crossroads source
        run: |
          git clone --depth 1 https://github.com/eonlynx/pokecrossroads.git crossroads
          git -C crossroads rev-parse HEAD

      - name: Apply Westeros prototype edits
        run: python3 crossroads_westeros/apply_westeros.py crossroads

      - name: Build ROM
        working-directory: crossroads
        env:
          GAME_VERSION: EMERALD
          COMPARE: 0
          UNUSED_ERROR: 0
          DEPRECATED_ERROR: 0
        run: |
          make -j$(nproc) -O all
          test -f westeros_crossroads.gba
          ls -lh westeros_crossroads.gba

      - name: Record build information
        run: |
          sha256sum crossroads/westeros_crossroads.gba | tee crossroads/WESTEROS_BUILD_SHA256.txt
          cat > crossroads/WESTEROS_BUILD_NOTES.txt <<'EOF'
          Crossroads Westeros prototype
          Base: eonlynx/pokecrossroads master
          Engine: pokeemerald-expansion / Pokemon Crossroads
          Prototype changes:
          - GBA title/header changed to WESTEROS RPG
          - Littleroot map name changed to WINTERFELL
          - New-game introduction rewritten for Westeros
          - Winterfell opening dialogue and first rescue hook re-themed
          This is a playable vertical-slice conversion, not yet a complete replacement of Pokemon mechanics/assets.
          EOF

      - name: Upload compiled ROM
        uses: actions/upload-artifact@v4
        with:
          name: westeros-crossroads-rom
          path: |
            crossroads/westeros_crossroads.gba
            crossroads/WESTEROS_BUILD_SHA256.txt
            crossroads/WESTEROS_BUILD_NOTES.txt
          if-no-files-found: error
          retention-days: 7
